services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      # Никаких дефолтов вида ":-secret" — в проде это должно быть явно задано,
      # иначе контейнер просто не стартует, вместо того чтобы тихо подняться с
      # паролем "secret", который лежит в публичном репозитории.
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER must be set} -d ${DB_NAME:?DB_NAME must be set}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  migrate:
    image: migrate/migrate
    volumes:
      - ./db/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER:?DB_USER must be set}:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/${DB_NAME:?DB_NAME must be set}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${DB_USER:?DB_USER must be set}:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/${DB_NAME:?DB_NAME must be set}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      IP_HASH_SECRET: ${IP_HASH_SECRET:?IP_HASH_SECRET must be set}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET must be set}
      APP_PORT: 8080
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
    volumes:
      - ./uploads:/app/uploads
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
      # 443 по умолчанию занимает Tailscale Funnel (он и даёт HTTPS), поэтому HTTPS nginx
      # слушает только локально. Свой сертификат без Funnel — задайте HTTPS_PORT=443.
      - "${HTTPS_PORT:-127.0.0.1:8443}:443"
    environment:
      # Имя сайта для HTTPS. Пусто — берётся из certs/host.txt (его пишет scripts/tls-cert.sh).
      PUBLIC_HOST: ${PUBLIC_HOST:-}
    volumes:
      # Сертификат (scripts/tls-cert.sh). Нет файлов — сайт работает по HTTP.
      - ./certs:/etc/nginx/certs:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
