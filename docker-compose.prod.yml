services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${DB_USER:-studentapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-discount_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-studentapp} -d ${DB_NAME:-discount_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  migrate:
    image: migrate/migrate
    volumes:
      - ./db/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER:-studentapp}:${DB_PASSWORD:-secret}@postgres:5432/${DB_NAME:-discount_db}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${DB_USER:-studentapp}:${DB_PASSWORD:-secret}@postgres:5432/${DB_NAME:-discount_db}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      IP_HASH_SECRET: ${IP_HASH_SECRET:-change-me}
      APP_PORT: 8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    volumes:
      - ./uploads:/app/uploads
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
