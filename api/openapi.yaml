openapi: 3.0.3
info:
  title: Student Discount Platform API
  description: API для платформы студенческих скидок
  version: 1.0.0
  contact:
    email: support@example.com
servers:
  - url: http://localhost:8080/api/v1
    description: Локальный сервер разработки

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        full_name:
          type: string
        student_status:
          type: string
          enum: [pending, verified, rejected]
        referral_code:
          type: string
        balance:
          type: number
        role:
          type: string
          enum: [student, merchant, admin, support]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Offer:
      type: object
      properties:
        id:
          type: integer
        company_id:
          type: integer
        title:
          type: string
        description:
          type: string
        discount_type:
          type: string
          enum: [percentage, fixed]
        discount_value:
          type: number
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [draft, pending_review, published, rejected, archived]
        bonus_allowed:
          type: boolean
        max_bonus_percent:
          type: integer
    Order:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        company_id:
          type: integer
        offer_id:
          type: integer
        subtotal:
          type: number
        discount_amount:
          type: number
        bonus_amount:
          type: number
        total_amount:
          type: number
        commission:
          type: number
        status:
          type: string
          enum: [created, paid, completed, cancelled, refunded]
        created_at:
          type: string
          format: date-time
    TransactionHistory:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [deposit, purchase, bonus, refund]
        amount:
          type: number
        description:
          type: string
        status:
          type: string
          enum: [pending, completed, failed]
        created_at:
          type: string
          format: date-time
    SupportTicket:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        subject:
          type: string
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
        priority:
          type: string
          enum: [low, normal, high, critical]
        assigned_to:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SupportMessage:
      type: object
      properties:
        id:
          type: integer
        ticket_id:
          type: integer
        user_id:
          type: integer
        message:
          type: string
        is_internal:
          type: boolean
        created_at:
          type: string
          format: date-time
    Company:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        logo_key:
          type: string
        website:
          type: string
        phone:
          type: string
        category_id:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserDetailedStats:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        balance:
          type: number
        bonus_balance:
          type: number
        total_deposits:
          type: number
        total_purchases:
          type: number
        total_orders:
          type: integer
        bonus_earned:
          type: number
        bonus_spent:
          type: number
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionHistory'

paths:
  # ---- Аутентификация ----
  /auth/register:
    post:
      summary: Регистрация нового пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                full_name:
                  type: string
                university_id:
                  type: integer
                course:
                  type: integer
                referral_code:
                  type: string
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
        '400':
          description: Неверный запрос
        '409':
          description: Email уже занят

  /auth/login:
    post:
      summary: Вход в систему
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
        '401':
          description: Неверные учётные данные

  # ---- Пользовательские ----
  /users/me:
    get:
      summary: Получить профиль текущего пользователя
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Не авторизован

  /users/transactions:
    get:
      summary: История транзакций
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список транзакций
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionHistory'

  /wallet:
    get:
      summary: Получить баланс (деньги + бонусы)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Баланс
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: number
                  bonus:
                    type: number

  /payments/deposit:
    post:
      summary: Пополнить баланс (заглушка)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
      responses:
        '200':
          description: Баланс пополнен

  /referral/code:
    get:
      summary: Получить реферальный код
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Реферальный код
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string

  /referral/stats:
    get:
      summary: Статистика рефералов
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Статистика рефералов
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_invites:
                    type: integer
                  active:
                    type: integer
                  bonus_total:
                    type: number

  /offers:
    get:
      summary: Список активных предложений
      responses:
        '200':
          description: Список предложений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Offer'

  /orders:
    post:
      summary: Создать заказ
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                offer_id:
                  type: integer
                bonus_points:
                  type: number
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
    get:
      summary: История заказов пользователя
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список заказов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /students/verify:
    post:
      summary: Запросить верификацию студента
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Заявка отправлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending]

  /statistics/student:
    get:
      summary: Статистика студента (заглушка)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Статистика
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_saved:
                    type: number
                  orders_count:
                    type: integer
                  top_category:
                    type: string
                  bonus_earned:
                    type: number

  /statistics/company:
    get:
      summary: Статистика компании (заглушка)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Статистика
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_orders:
                    type: integer
                  unique_students:
                    type: integer
                  avg_check:
                    type: number
                  total_revenue:
                    type: number

  # ---- Поддержка (пользователь) ----
  /support/tickets:
    post:
      summary: Создать тикет поддержки
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                first_message:
                  type: string
      responses:
        '201':
          description: Тикет создан
    get:
      summary: Список тикетов пользователя
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список тикетов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupportTicket'

  /support/tickets/{id}/messages:
    get:
      summary: Получить сообщения тикета
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Сообщения тикета
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupportMessage'
    post:
      summary: Отправить сообщение в тикет
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
      responses:
        '201':
          description: Сообщение отправлено

  # ---- Админские эндпоинты (требуют роль admin) ----
  /admin/statistics:
    get:
      summary: Общая статистика (админ)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Статистика
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_users:
                    type: integer
                  total_companies:
                    type: integer
                  total_offers:
                    type: integer
                  total_orders:
                    type: integer
                  total_revenue:
                    type: number

  /admin/users:
    get:
      summary: Список пользователей (админ)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
  /admin/users/{id}:
    get:
      summary: Получить пользователя по ID (админ)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Данные пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /admin/users/{id}/stats:
    get:
      summary: Детальная статистика пользователя (админ)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Детальная статистика
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailedStats'
  /admin/users/role:
    put:
      summary: Обновить роль пользователя (админ)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                role:
                  type: string
                  enum: [student, merchant, admin, support]
      responses:
        '200':
          description: Роль обновлена

  /admin/companies:
    get:
      summary: Список компаний (админ)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список компаний
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
    post:
      summary: Создать компанию (админ)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Company'
      responses:
        '201':
          description: Компания создана
  /admin/companies/{id}:
    put:
      summary: Обновить компанию (админ)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Company'
      responses:
        '200':
          description: Компания обновлена
    delete:
      summary: Удалить компанию (админ)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Компания удалена

  /admin/offers:
    get:
      summary: Все предложения (для модерации)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список предложений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Offer'
    post:
      summary: Создать предложение (админ)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Offer'
      responses:
        '201':
          description: Предложение создано
  /admin/offers/{id}:
    put:
      summary: Обновить предложение (админ)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Offer'
      responses:
        '200':
          description: Предложение обновлено
    delete:
      summary: Удалить предложение (админ)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Предложение удалено

  /admin/offers/{id}/moderate:
    put:
      summary: Опубликовать или отклонить предложение (админ)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [publish, reject]
      responses:
        '200':
          description: Статус обновлён

  /admin/verifications:
    get:
      summary: Список заявок на верификацию (админ)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список заявок
  /admin/verifications/{id}:
    put:
      summary: Обновить статус верификации (админ)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [verified, rejected]
                rejection_reason:
                  type: string
      responses:
        '200':
          description: Статус обновлён

  /admin/support/tickets:
    get:
      summary: Все тикеты поддержки (админ)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список тикетов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupportTicket'

  /admin/support/tickets/{id}/status:
    put:
      summary: Обновить статус тикета (админ)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [open, in_progress, resolved, closed]
      responses:
        '200':
          description: Статус обновлён

  /admin/support/tickets/{id}/messages:
    post:
      summary: Отправить сообщение как админ (внутреннее)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
      responses:
        '201':
          description: Сообщение отправлено

  # ---- Партнёрские эндпоинты (требуют роль merchant) ----
  /merchant/companies:
    get:
      summary: Компании партнёра
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список компаний
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'

  /merchant/offers:
    get:
      summary: Предложения партнёра
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список предложений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Offer'
    post:
      summary: Создать предложение (партнёр)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_id:
                  type: integer
                title:
                  type: string
                description:
                  type: string
                discount_type:
                  type: string
                  enum: [percentage, fixed]
                discount_value:
                  type: number
                start_at:
                  type: string
                  format: date-time
                end_at:
                  type: string
                  format: date-time
                bonus_allowed:
                  type: boolean
                max_bonus_percent:
                  type: integer
      responses:
        '201':
          description: Предложение создано

  /merchant/offers/{id}/submit:
    post:
      summary: Отправить предложение на модерацию (партнёр)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Предложение отправлено

  /merchant/statistics/daily:
    get:
      summary: Ежедневная статистика партнёра (заглушка)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: Статистика
          content:
            application/json:
              schema:
                type: object
                properties:
                  daily:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        orders:
                          type: integer
                        revenue:
                          type: number
