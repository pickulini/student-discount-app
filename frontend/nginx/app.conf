# Общая часть сайта: подключается и в HTTP-, и в HTTPS-сервер.
client_max_body_size 10M;

root /usr/share/nginx/html;
index index.html;

# Статика (JS, CSS, картинки фронта)
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# SSE: отключаем всё буферизирование и gzip, соединение не рвём.
location = /api/v1/notifications/stream {
    proxy_pass http://api:8080;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header Connection "";

    gzip off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    chunked_transfer_encoding on;

    keepalive_timeout 0;
    proxy_connect_timeout 24h;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
    send_timeout 24h;
}

# API → Go-бэкенд
location /api/ {
    proxy_pass http://api:8080;
    include /etc/nginx/snippets/proxy.conf;
    proxy_read_timeout 60s;
}

# Платёжные страницы → Go-бэкенд
location /payments/ {
    proxy_pass http://api:8080;
    include /etc/nginx/snippets/proxy.conf;
}

# Загруженные файлы → Go-бэкенд
location /uploads/ {
    proxy_pass http://api:8080;
    include /etc/nginx/snippets/proxy.conf;
    expires 7d;
}

# index.html никогда не кэшируем: иначе после пересборки браузер
# продолжает открывать старую версию сайта (старые имена бандлов).
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
}

# SPA-fallback: всё остальное → index.html (для React Router)
location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
}
