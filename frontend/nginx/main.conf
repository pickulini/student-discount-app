# Главный конфиг nginx: поднимаем лимит одновременных соединений
# (по умолчанию 1024 на процесс — это ~500 открытых вкладок с живым потоком событий).
user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  16384;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens off;

    # Протокол, по которому пришёл пользователь. Если перед nginx стоит прокси с TLS
    # (Tailscale Funnel/Serve), он присылает X-Forwarded-Proto: https — верим только этому значению.
    map $http_x_forwarded_proto $fwd_proto {
        default $scheme;
        https   https;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/conf.d/*.conf;
}
