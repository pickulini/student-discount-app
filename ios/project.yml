name: StudentDiscountApp
options:
  bundleIdPrefix: com.studentdiscount
  deploymentTarget:
    iOS: "16.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_PREVIEWS: YES
targets:
  StudentDiscountApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: StudentDiscountApp/Sources
    resources:
      - path: StudentDiscountApp/Resources
    info:
      path: StudentDiscountApp/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Студенческие скидки
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studentdiscount.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []
      gatherCoverageData: false
