name: StudentDiscountApp
options:
  bundleIdPrefix: com.studentdiscount
  deploymentTarget:
    iOS: "16.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_PREVIEWS: YES
targets:
  StudentDiscountApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: StudentDiscountApp/Sources
      - path: StudentDiscountApp/Resources
        excludes:
          - Info.plist
    info:
      path: StudentDiscountApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: Студент−%
        CFBundleDevelopmentRegion: ru
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - Unbounded-Medium.ttf
          - Unbounded-Bold.ttf
          - Manrope-Regular.ttf
          - Manrope-Medium.ttf
          - Manrope-SemiBold.ttf
          - Manrope-Bold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-Bold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Камера нужна, чтобы сфотографировать студенческий билет для верификации.
        NSLocationWhenInUseUsageDescription: Геопозиция нужна, чтобы показать места со скидками рядом с вами и расстояние до них.
        NSPhotoLibraryUsageDescription: Доступ к фото нужен, чтобы выбрать снимок студенческого билета или аватар.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studentdiscount.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []
      gatherCoverageData: false
